# docker-compose.yml
version: '3.8'

volumes:
  postgres_data:
  redis_data:

services:
  postgres:
    image: postgres:15-alpine
    build:
      context: .
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports: ["5450:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data